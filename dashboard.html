<style>
/* ============================================================
   ТестПлат — дизайн-система
   Направление: «экзаменационный бланк»: бумажный фон, чернильные
   поверхности, кобальтовый акцент, варианты-«пузырьки» А/Б/В/Г,
   фирменный элемент — таймер-кольцо, меняющее цвет.
   ============================================================ */

:root {
  --paper: #F6F7FB;
  --card: #FFFFFF;
  --ink: #141E42;
  --ink-2: #3D4770;
  --muted: #8A90A8;
  --line: #E4E7F0;
  --line-2: #D5D9E8;
  --brand: #2E4FE0;
  --brand-dark: #2440BE;
  --brand-soft: #EAEFFF;
  --ok: #1F9D63;
  --ok-bg: #E9F7F0;
  --warn: #C97F12;
  --warn-bg: #FBF3E3;
  --danger: #D64545;
  --danger-bg: #FCEFEF;
  --sidebar: #141E42;
  --sidebar-2: #1D2A57;
  --radius: 14px;
  --radius-s: 10px;
  --shadow: 0 1px 2px rgba(20, 30, 66, .05), 0 8px 24px -12px rgba(20, 30, 66, .18);
  --shadow-lg: 0 24px 64px -24px rgba(20, 30, 66, .38);
  --f-display: 'Unbounded', 'Golos Text', system-ui, sans-serif;
  --f-body: 'Golos Text', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3 { margin: 0 0 .4em; line-height: 1.25; }
h1 { font-size: 26px; font-weight: 600; }
h2 { font-size: 19px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
p { margin: 0 0 .8em; }
:last-child { margin-bottom: 0; }
hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
::selection { background: var(--brand-soft); }

:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ------------------------------- кнопки ------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 500 14px/1 var(--f-body);
  padding: 11px 18px;
  border-radius: var(--radius-s);
  border: 1px solid transparent;
  cursor: pointer;
  background: var(--brand);
  color: #fff;
  transition: background .15s, border-color .15s, color .15s, box-shadow .15s;
  white-space: nowrap;
  user-select: none;
}
.btn:hover { background: var(--brand-dark); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn--ghost { background: transparent; color: var(--ink-2); border-color: var(--line-2); }
.btn--ghost:hover { background: #fff; border-color: var(--ink-2); color: var(--ink); }
.btn--danger { background: transparent; color: var(--danger); border-color: #EDD2D2; }
.btn--danger:hover { background: var(--danger-bg); border-color: var(--danger); }
.btn--soft { background: var(--brand-soft); color: var(--brand); }
.btn--soft:hover { background: #DCE4FF; }
.btn--sm { padding: 7px 12px; font-size: 13px; border-radius: 8px; }
.btn--lg { padding: 14px 26px; font-size: 15px; border-radius: 12px; }
.btn--block { width: 100%; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 32px; height: 32px; border-radius: 8px;
  border: 1px solid var(--line); background: #fff; color: var(--muted);
  cursor: pointer; transition: all .15s;
}
.icon-btn:hover { color: var(--ink); border-color: var(--line-2); }
.icon-btn:disabled { opacity: .4; cursor: not-allowed; }
.icon-btn:disabled:hover { color: var(--muted); border-color: var(--line); }
.icon-btn--danger:hover { color: var(--danger); border-color: var(--danger); background: var(--danger-bg); }
.icon-btn svg { width: 16px; height: 16px; }

/* ------------------------------- формы -------------------------------- */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--muted); }
.input, .select, textarea.input {
  font: 400 14px/1.4 var(--f-body);
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line-2);
  border-radius: var(--radius-s);
  padding: 10px 12px;
  width: 100%;
  transition: border-color .15s, box-shadow .15s;
}
.input:focus, .select:focus, textarea.input:focus {
  outline: none; border-color: var(--brand);
  box-shadow: 0 0 0 3px var(--brand-soft);
}
.input::placeholder { color: #B4B9CC; }
textarea.input { resize: vertical; min-height: 70px; }
.row { display: flex; gap: 12px; }
.row > * { flex: 1; }
.form-error {
  display: none;
  background: var(--danger-bg); color: var(--danger);
  border: 1px solid #F0D3D3;
  border-radius: var(--radius-s);
  padding: 10px 12px; font-size: 13px; margin-bottom: 14px;
}
.form-error.show { display: block; }

/* переключатель */
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; }
.switch .track {
  width: 38px; height: 22px; border-radius: 999px;
  background: var(--line-2); position: relative; transition: background .18s; flex: none;
}
.switch .track::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25);
  transition: transform .18s;
}
.switch input:checked + .track { background: var(--brand); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { outline: 2px solid var(--brand); outline-offset: 2px; }
.switch .lbl { font-size: 14px; color: var(--ink-2); }

/* радио-«пузырёк» правильного ответа */
.pick { position: absolute; opacity: 0; }
.pick + .bubble {
  width: 26px; height: 26px; border-radius: 50%; flex: none;
  border: 2px solid var(--line-2);
  display: inline-flex; align-items: center; justify-content: center;
  font: 600 11px var(--f-mono); color: transparent;
  cursor: pointer; transition: all .15s; background: #fff;
}
.pick:checked + .bubble { border-color: var(--ok); background: var(--ok); color: #fff; }
.pick:focus-visible + .bubble { outline: 2px solid var(--brand); outline-offset: 2px; }

/* ------------------------------- карточки ------------------------------ */
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.panel__body { padding: 20px; }
.panel__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.panel__head h2 { margin: 0; }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  font: 500 12px/1 var(--f-body);
  padding: 5px 10px; border-radius: 999px;
  background: var(--brand-soft); color: var(--brand);
}
.badge--ok { background: var(--ok-bg); color: var(--ok); }
.badge--danger { background: var(--danger-bg); color: var(--danger); }
.badge--warn { background: var(--warn-bg); color: var(--warn); }
.badge--neutral { background: #EFF1F7; color: var(--ink-2); }

/* ------------------------------- таблицы ------------------------------- */
.table-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th {
  text-align: left; font-weight: 600; font-size: 12px; letter-spacing: .04em; text-transform: uppercase;
  color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
.tbl td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { transition: background .1s; }
.tbl tbody tr:hover { background: #FAFBFE; }
.tbl .num { font-family: var(--f-mono); font-size: 13px; }

/* ---------------------------- пустое состояние -------------------------- */
.empty { text-align: center; padding: 48px 24px; color: var(--muted); }
.empty svg { width: 40px; height: 40px; opacity: .4; margin-bottom: 10px; }
.empty b { display: block; color: var(--ink-2); font-size: 15px; margin-bottom: 4px; }
.empty .btn { margin-top: 14px; }

/* ---------------------------- раскладка приложения --------------------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 248px; flex: none;
  background: var(--sidebar);
  color: rgba(255,255,255,.78);
  display: flex; flex-direction: column;
  padding: 20px 14px;
  position: sticky; top: 0; height: 100vh;
}
.logo { display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px; }
.logo .mark {
  width: 34px; height: 34px; border-radius: 10px;
  background: linear-gradient(135deg, #3D5BFF, #1E2F8F);
  display: grid; place-items: center;
  font: 700 15px var(--f-display); color: #fff;
}
.logo .name { font: 600 15px var(--f-display); color: #fff; letter-spacing: .01em; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a {
  display: flex; align-items: center; gap: 11px;
  padding: 10px 12px; border-radius: var(--radius-s);
  color: rgba(255,255,255,.72); font-size: 14px; font-weight: 500;
  text-decoration: none; transition: all .15s;
}
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav a:hover { background: var(--sidebar-2); color: #fff; text-decoration: none; }
.nav a.active { background: var(--brand); color: #fff; }
.sidebar__foot { margin-top: auto; border-top: 1px solid rgba(255,255,255,.1); padding-top: 14px; }
.whoami { display: flex; align-items: center; gap: 10px; padding: 4px 8px; }
.whoami .ava {
  width: 34px; height: 34px; border-radius: 50%; flex: none;
  background: rgba(255,255,255,.12); color: #fff;
  display: grid; place-items: center; font-weight: 600; font-size: 14px;
}
.whoami .nm { font-size: 13px; color: #fff; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.whoami .rl { font-size: 11px; color: rgba(255,255,255,.55); }
.whoami button {
  margin-left: auto; background: none; border: 0; color: rgba(255,255,255,.55);
  cursor: pointer; padding: 6px; border-radius: 8px; display: flex;
}
.whoami button:hover { color: #fff; background: rgba(255,255,255,.1); }
.whoami button svg { width: 16px; height: 16px; }

.main { flex: 1; min-width: 0; padding: 28px 32px 48px; }
.pagehead { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.pagehead .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }

.grid { display: grid; gap: 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 22px; }
.stat { padding: 18px 20px; }
.stat .v { font: 600 30px/1.1 var(--f-mono); letter-spacing: -.02em; }
.stat .v small { font-size: 18px; color: var(--muted); }
.stat .l { font-size: 13px; color: var(--muted); margin-top: 4px; }

/* карточки тестов у пользователя */
.tests-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.test-card { display: flex; flex-direction: column; gap: 12px; padding: 20px; }
.test-card h3 { margin: 0; }
.test-card .desc { color: var(--ink-2); font-size: 14px; flex: 1; }
.meta-row { display: flex; flex-wrap: wrap; gap: 6px; }

/* ------------------------------- модалки ------------------------------- */
.overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(15, 20, 45, .5); backdrop-filter: blur(3px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 4vh 16px; overflow-y: auto;
  animation: fadeIn .18s ease-out;
}
.modal {
  background: #fff; border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  width: 100%; max-width: 560px;
  margin-bottom: 4vh;
  animation: slideUp .22s cubic-bezier(.2,.9,.3,1.1);
}
.modal--wide { max-width: 860px; }
.modal__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; border-radius: var(--radius) var(--radius) 0 0; z-index: 2; }
.modal__head h2 { margin: 0; font-size: 18px; }
.modal__body { padding: 22px; }
.modal__foot { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--line); position: sticky; bottom: 0; background: #fff; border-radius: 0 0 var(--radius) var(--radius); }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(14px); } }

/* ------------------------- редактор теста (админ) ---------------------- */
.qcard { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; background: #FDFDFE; }
.qcard__head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.qnum {
  width: 30px; height: 30px; border-radius: 50%; flex: none;
  background: var(--ink); color: #fff;
  display: grid; place-items: center; font: 600 13px var(--f-mono);
}
.opt-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.opt-row .input { flex: 1; }
.opt-row .del { flex: none; }
.chip-letter {
  width: 30px; height: 30px; border-radius: 9px; flex: none;
  border: 1.5px solid var(--line-2); background: #fff;
  display: grid; place-items: center;
  font: 600 13px var(--f-body); color: var(--ink-2);
}
.hint-correct { font-size: 12px; color: var(--muted); margin: 4px 0 10px 36px; }

/* список выбора доступа */
.pick-list { max-height: 320px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius-s); }
.pick-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
.pick-item:last-child { border-bottom: 0; }
.pick-item:hover { background: #FAFBFE; }
.pick-item .nm { flex: 1; }
.pick-item .nm b { display: block; font-size: 14px; }
.pick-item .nm span { font-size: 12px; color: var(--muted); }
.cbx { width: 18px; height: 18px; accent-color: var(--brand); flex: none; }

/* --------------------------------- тосты ------------------------------- */
#toasts { position: fixed; right: 18px; bottom: 18px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--ink); color: #fff;
  padding: 11px 16px; border-radius: var(--radius-s);
  font-size: 14px; box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 9px;
  animation: toastIn .25s cubic-bezier(.2,.9,.3,1.1);
  max-width: 360px;
}
.toast--ok::before, .toast--err::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%; flex: none;
}
.toast--ok::before { background: #3DDC97; }
.toast--err::before { background: #FF7A7A; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }

/* =========================== экран входа ================================ */
.auth { display: flex; min-height: 100vh; }
.auth__side {
  flex: 1.15; background: var(--sidebar); color: #fff;
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
  padding: 44px 52px;
}
.auth__side::before {
  /* мотив бланка: сетка «пузырьков» ответов */
  content: '';
  position: absolute; inset: 0; opacity: .5;
  background-image: radial-gradient(rgba(255,255,255,.14) 1.6px, transparent 1.6px);
  background-size: 34px 34px;
  mask-image: linear-gradient(200deg, rgba(0,0,0,.9) 20%, transparent 75%);
  -webkit-mask-image: linear-gradient(200deg, rgba(0,0,0,.9) 20%, transparent 75%);
}
.auth__side > * { position: relative; }
.auth__brand { display: flex; align-items: center; gap: 12px; }
.auth__brand .mark {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(135deg, #3D5BFF, #1E2F8F);
  display: grid; place-items: center;
  font: 700 19px var(--f-display);
}
.auth__brand .name { font: 600 19px var(--f-display); }
.auth__pitch h1 {
  font: 600 clamp(26px, 3.2vw, 40px)/1.2 var(--f-display);
  letter-spacing: -.01em; max-width: 480px;
}
.auth__pitch p { color: rgba(255,255,255,.66); max-width: 420px; font-size: 15px; }
.auth__demo { display: flex; gap: 8px; }
.auth__demo span {
  width: 34px; height: 34px; border-radius: 10px;
  border: 1.5px solid rgba(255,255,255,.28);
  display: grid; place-items: center;
  font: 600 13px var(--f-body); color: rgba(255,255,255,.8);
}
.auth__demo span:first-child { background: var(--brand); border-color: var(--brand); }
.auth__main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
.auth__card { width: 100%; max-width: 420px; }
.auth__card .panel__body { padding: 30px; }
.auth__card h1 { font-size: 22px; }
.auth__card .sub { color: var(--muted); font-size: 14px; margin-bottom: 22px; }

/* ========================= прохождение теста ============================ */
.take { max-width: 760px; margin: 0 auto; }
.take__top { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
.take__counter { font: 600 13px var(--f-mono); color: var(--ink-2); letter-spacing: .06em; text-transform: uppercase; }
.take__progress { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; margin-bottom: 20px; }
.take__progress i { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width .3s ease; }

.timer { position: relative; width: 76px; height: 76px; flex: none; }
.timer svg { width: 76px; height: 76px; transform: rotate(-90deg); }
.timer .bgc { fill: none; stroke: var(--line); stroke-width: 6; }
.timer .fgc { fill: none; stroke: var(--brand); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .3s linear, stroke .3s; }
.timer .num {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  font: 600 17px var(--f-mono); letter-spacing: -.03em;
}
.timer--warn .fgc { stroke: var(--warn); }
.timer--warn .num { color: var(--warn); }
.timer--danger .fgc { stroke: var(--danger); }
.timer--danger .num { color: var(--danger); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .45; } }

.qcard__take { padding: 30px; }
.qcard__take .qtext { font-size: 20px; font-weight: 600; line-height: 1.45; margin: 14px 0 24px; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  display: flex; align-items: center; gap: 14px;
  border: 1.5px solid var(--line-2); border-radius: 12px;
  background: #fff; padding: 14px 16px;
  cursor: pointer; text-align: left;
  font: 400 15px var(--f-body); color: var(--ink);
  transition: border-color .13s, background .13s, transform .06s;
}
.opt:hover { border-color: var(--brand); }
.opt:active { transform: scale(.997); }
.opt .bub {
  width: 34px; height: 34px; border-radius: 10px; flex: none;
  border: 1.5px solid var(--line-2);
  display: grid; place-items: center;
  font: 600 14px var(--f-body); color: var(--ink-2);
  transition: inherit;
}
.opt.selected { border-color: var(--brand); background: var(--brand-soft); }
.opt.selected .bub { background: var(--brand); border-color: var(--brand); color: #fff; }
/* подсказка «можно несколько ответов» */
.qhint { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--f-body); color: var(--brand); background: var(--brand-soft); border-radius: 999px; padding: 5px 12px; margin-bottom: 12px; }
.qhint::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.qhint[hidden] { display: none; }
.take__foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; }
.take__skip { color: var(--muted); font-size: 13px; }

/* полноэкранное прохождение: варианты ответов сеткой */
.opts--grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .opts--grid { grid-template-columns: 1fr; } }

/* полноэкранное прохождение по ссылке (join) */
body.taking .join { display: block; padding: 0; }
body.taking .join .panel { max-width: none; width: 100%; border: 0; border-radius: 0; box-shadow: none; }
.take-shell { display: flex; flex-direction: column; min-height: 100vh; }
.take-shell__head { border-bottom: 1px solid var(--line); }
.take-shell__head .take__progress { margin: 0; border-radius: 0; }
.take-shell__wrap { width: 100%; max-width: 1080px; margin: 0 auto; }
.take-shell__top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 28px; }
.take-shell__body { flex: 1; display: flex; flex-direction: column; }
.take-shell__main { flex: 1; display: flex; flex-direction: column; padding: 34px 28px 30px; }
.take-shell__main .qtext { font-size: 22px; font-weight: 600; line-height: 1.5; margin: 0 0 26px; }
.take-shell__main .take__foot { margin-top: auto; padding-top: 30px; }
.take-shell__main .opt { padding: 17px 18px; }

/* полноэкранное прохождение в кабинете */
.take--full { max-width: none; min-height: calc(100vh - 76px); display: flex; flex-direction: column; }
.take--full .qcard__take { flex: 1; display: flex; flex-direction: column; }
.take--full .qcard__take .qtext { font-size: 22px; }
.take--full .take__foot { margin-top: auto; }
.take--full .opt { padding: 17px 18px; }

/* ------------------------------- результат ----------------------------- */
.result-hero { text-align: center; padding: 36px 20px 28px; }
.score-ring { position: relative; width: 168px; height: 168px; margin: 0 auto 18px; }
.score-ring svg { width: 168px; height: 168px; transform: rotate(-90deg); }
.score-ring .bgc { fill: none; stroke: var(--line); stroke-width: 10; }
.score-ring .fgc { fill: none; stroke-width: 10; stroke-linecap: round; }
.score-ring .val {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font: 600 44px/1 var(--f-mono); letter-spacing: -.04em;
}
.score-ring .val small {
  font-size: 18px; line-height: 1; color: var(--muted); font-family: var(--f-mono);
  transform: translateY(10px);
}
.result-hero .verdict { font: 600 15px var(--f-body); }
.result-hero .detail { color: var(--muted); font-size: 14px; margin-top: 6px; }

.review-item { border: 1px solid var(--line); border-radius: var(--radius-s); padding: 14px 16px; margin-bottom: 10px; background: #fff; }
.review-item.ok { border-color: #BCE5D2; background: var(--ok-bg); }
.review-item.bad { border-color: #F0D3D3; background: var(--danger-bg); }
.review-item .rhead { display: flex; gap: 10px; align-items: baseline; }
.review-item .mark { font: 700 13px var(--f-mono); flex: none; }
.review-item.ok .mark { color: var(--ok); }
.review-item.bad .mark { color: var(--danger); }
.review-item .q { font-weight: 600; font-size: 14px; }
.review-item .answers { margin-top: 8px; font-size: 13.5px; display: flex; flex-direction: column; gap: 3px; }
.review-item .answers .rowline { display: flex; gap: 8px; align-items: baseline; }
.review-item .answers .tag { font: 600 11px var(--f-body); border-radius: 6px; padding: 2px 7px; flex: none; }
.tag--chosen { background: rgba(214,69,69,.14); color: var(--danger); }
.tag--correct { background: rgba(31,157,99,.14); color: var(--ok); }
.tag--missed { background: #EFF1F7; color: var(--ink-2); }
.tag--partial { background: var(--warn-bg); color: var(--warn); }

/* ------------------------------ адаптив -------------------------------- */
@media (max-width: 960px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; flex-direction: row; align-items: center; gap: 10px; padding: 10px 14px; flex-wrap: wrap; }
  .logo { padding: 0 6px 0 0; }
  .sidebar .nav { flex-direction: row; flex-wrap: wrap; }
  .nav a { padding: 8px 10px; }
  .nav a svg { display: none; }
  .sidebar__foot { margin: 0 0 0 auto; border: 0; padding: 0; display: flex; align-items: center; gap: 8px; }
  .whoami .ava { width: 30px; height: 30px; }
  .whoami .info { display: none; }
  .main { padding: 20px 16px 40px; }
  .auth { flex-direction: column; }
  .auth__side { padding: 28px; min-height: 220px; }
  .auth__demo { display: none; }
  .row { flex-direction: column; }
  .take--full { min-height: 0; }
}
@media (max-width: 560px) {
  .opts .opt { padding: 12px; }
  .qcard__take { padding: 20px; }
  .take__top { gap: 10px; }
  .take-shell__top { padding: 14px 16px; }
  .take-shell__main { padding: 22px 16px 20px; }
}

/* ------------------------- картинки в тестах --------------------------- */
.qimg { margin: 0 0 18px; }
.qimg[hidden] { display: none; }
.qimg img { max-width: 100%; max-height: 320px; border-radius: 10px; border: 1px solid var(--line); background: #fff; }
.opt__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.opt--img { align-items: flex-start; }
.opt__img { max-width: 100%; max-height: 190px; border-radius: 8px; border: 1px solid var(--line); object-fit: contain; background: #fff; }
.qmedia { margin: 0 0 12px 40px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.img-prev { position: relative; display: inline-block; }
.img-prev img { display: block; max-width: 240px; max-height: 140px; border-radius: 10px; border: 1px solid var(--line); object-fit: contain; background: #fff; }
.img-prev .icon-btn { position: absolute; top: -9px; right: -9px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(16, 24, 40, .16); }
.opt-row .oimg-add { flex: none; }
.oimg-thumb { position: relative; flex: none; width: 40px; height: 40px; }
.oimg-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; background: #fff; }
.oimg-thumb .oimg-del { position: absolute; top: -7px; right: -7px; width: 18px; height: 18px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: #fff; color: var(--ink-2); font: 700 10px/1 var(--f-body); cursor: pointer; display: grid; place-items: center; }
.oimg-thumb .oimg-del:hover { color: var(--danger); border-color: var(--danger); }
.rimg img { max-height: 150px; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); margin-top: 8px; }
.rthumb { height: 34px; border-radius: 6px; border: 1px solid var(--line); }

/* ---------------- итог: проценты крупно и только ошибки ---------------- */
.finish-wrap { margin: auto 0; }
.score-ring--lg { width: 214px; height: 214px; margin-bottom: 24px; }
.score-ring--lg svg { width: 214px; height: 214px; }
.score-ring--lg .val { font-size: 58px; }
.score-ring--lg .val small { font-size: 23px; transform: translateY(13px); }
.mistakes { width: 100%; max-width: 760px; margin: 30px auto 8px; }
.mistakes__head { display: flex; align-items: center; gap: 10px; font: 600 16px var(--f-body); margin-bottom: 14px; }
.mistakes-none {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 20px; border: 1px solid #BCE5D2; background: var(--ok-bg); color: var(--ok);
  font: 600 14.5px var(--f-body); border-radius: var(--radius-s);
}

<body>

<div class="app">
  <aside class="sidebar">

        <div class="ava" id="userAva">?</div>

  </aside>

  <main class="main">
    <!-- СПИСОК ТЕСТОВ -->
    <section id="view-tests" class="view">
      <div class="pagehead">
        <div>
          <h1>Мои тесты</h1>
          <div class="sub">Тесты, доступ к которым выдал администратор</div>

    <section id="view-results" class="view" hidden>
      <div class="pagehead">
        <div>
          <h1>Мои результаты</h1>
          <div class="sub">История ваших прохождений</div>
        </div>
      </div>
      <div class="panel">
        <div class="table-wrap" id="resultsTable"></div>
      </div>
    </section>

    <!-- ПРОХОЖДЕНИЕ ТЕСТА -->

      <div class="take take--full">
        <div class="take__top">

            <div style="font-weight:600" id="takeTitle"></div>
            <div class="take__counter" id="takeCounter"></div>
          </div>
          <div class="timer" id="takeTimer" role="timer">
            <svg viewBox="0 0 76 76"><circle class="bgc" cx="38" cy="38" r="33"/><circle class="fgc" id="timerArc" cx="38" cy="38" r="33"/></svg>
            <div class="num" id="timerNum">0:00</div>

          <div class="qhint" id="qHint" hidden>Можно выбрать несколько ответов</div>

<script>
'use strict';
/* Общие хелперы: API-обёртка, тосты, форматирование, разбор результатов */

/* адрес сервера: на основном сайте пусто (тот же домен), на зеркалах —
   основной бэкенд, куда уходят все запросы */
const API_BASE = window.__API_BASE || '';

async function api(path, opts = {}) {
  /* сетевые сбои повторяем: GET — 3 попытки, остальные — 2; ошибки самого
     сервера (4xx/5xx) не повторяем. У каждой попытки лимит времени: если
     ответ не приходит (сеть «подвисла»), запрос прерывается и повторяется —
     страница никогда не висит бесконечно. На старых браузерах без
     AbortController работает без лимита, но не падает. */
  const maxTries = (opts.method || 'GET') === 'GET' ? 3 : 2;
  let res = null;
  for (let attempt = 0; attempt < maxTries; attempt++) {
    const canAbort = typeof AbortController === 'function';
    const ctrl = canAbort ? new AbortController() : null;
    const timer = canAbort ? setTimeout(() => ctrl.abort(), 12000) : null;
    try {
      res = await fetch(API_BASE + path, {
        method: opts.method || 'GET',
        headers: opts.body ? { 'Content-Type': 'application/json' } : undefined,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
        credentials: API_BASE ? 'include' : 'same-origin',
        ...(ctrl ? { signal: ctrl.signal } : {})
      });
      if (timer) clearTimeout(timer);
      break;
    } catch (e) {
      if (timer) clearTimeout(timer);
      if (attempt < maxTries - 1) await new Promise(r => setTimeout(r, 1200));
    }
  }
  if (!res) throw new Error('Сервер не отвечает. Проверьте интернет и попробуйте ещё раз.');
  let data = null;
  try { data = await res.json(); } catch { /* пусто */ }
  if (!res.ok) {
    const e = new Error((data && data.error) || `Ошибка ${res.status}`);
    e.status = res.status;
    throw e;
  }
  return data;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function toast(msg, type = 'ok') {
  let box = document.getElementById('toasts');
  if (!box) { box = document.createElement('div'); box.id = 'toasts'; document.body.appendChild(box); }
  const t = document.createElement('div');
  t.className = `toast toast--${type}`;
  t.textContent = msg;
  box.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; }, 3200);
  setTimeout(() => t.remove(), 3600);
}

function fmtDate(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function fmtTimeLeft(sec) {
  const m = Math.floor(sec / 60), s = sec % 60;
  return s < 10 ? `${m}:0${s}` : `${m}:${s}`;
}

function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}

const LETTERS = ['А', 'Б', 'В', 'Г', 'Д', 'Е', 'Ж', 'З'];

/* модальное окно; content — HTML строки; возвращает элемент .modal */
function openModal(contentHTML, { wide = false } = {}) {
  const ov = document.createElement('div');
  ov.className = 'overlay';
  ov.innerHTML = `<div class="modal${wide ? ' modal--wide' : ''}">${contentHTML}</div>`;
  document.body.appendChild(ov);
  const close = () => ov.remove();
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  document.addEventListener('keydown', function onEsc(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', onEsc); }
  });
  ov.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', close));
  return ov.querySelector('.modal');
}

/* балл может быть дробным (частичный зачёт) — красивый вывод */
function fmtScore(s) {
  const v = Math.round((Number(s) || 0) * 100) / 100;
  return Number.isInteger(v) ? String(v) : String(v).replace(/0$/, '');
}

/* разбор попытки: список вопросов с верным/неверным ответом (поддерживает несколько ответов и картинки) */
function renderReview(review, container) {
  container.innerHTML = review.map(r => {
    const norm = v => Array.isArray(v) ? v : (v === null || v === undefined ? [] : [v]);
    const chosen = norm(r.chosen);
    const correct = norm(r.correct);
    const optImg = ci => {
      const im = (r.optionImages || [])[ci];
      return im ? `<img class="rthumb" src="${esc(im)}" alt="">` : '';
    };
    const chosenLines = chosen.length
      ? chosen.map(ci => `<div class="rowline"><span class="tag tag--chosen">ваш ответ</span><span>${LETTERS[ci]}. ${esc(r.options[ci])}</span>${optImg(ci)}</div>`).join('')
      : `<div class="rowline"><span class="tag tag--missed">нет ответа</span></div>`;
    const correctLines = correct.map(ci => `<div class="rowline"><span class="tag tag--correct">верный ответ</span><span>${LETTERS[ci]}. ${esc(r.options[ci])}</span>${optImg(ci)}</div>`).join('');
    const partialBadge = (!r.ok && r.frac > 0)
      ? `<span class="tag tag--partial">частичный зачёт: ${r.frac}% вопроса</span>`
      : '';
    return `<div class="review-item ${r.ok ? 'ok' : 'bad'}">
      <div class="rhead"><span class="mark">${r.ok ? '✓' : '✕'}</span><span class="q">${esc(r.text)}</span>${partialBadge}</div>
      ${r.image ? `<div class="rimg"><img src="${esc(r.image)}" alt=""></div>` : ''}
      <div class="answers">${chosenLines}${correctLines}</div>
    </div>`;
  }).join('');
}

/* итог попытки: показываем только неверные вопросы, верные не отвлекают */
function renderMistakes(review, container) {
  const wrong = review.filter(r => !r.ok);
  if (!wrong.length) {
    container.innerHTML = '<div class="mistakes-none"><span>✓</span>Все ответы верные — ошибок нет</div>';
    return;
  }
  container.innerHTML = `
    <div class="mistakes__head">Что неверно <span class="badge badge--danger">${wrong.length}</span></div>
    <div class="mistakes__list"></div>`;
  renderReview(wrong, container.querySelector('.mistakes__list'));
}

/* иконки */
const ICONS = {
  grid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>',
  img: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>',
  users: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
  chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/></svg>',
  logout: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>',
  key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>',
  link: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>'
};

</script>
<script>
'use strict';
/* Кабинет пользователя: доступные тесты, прохождение с таймером, результаты */

let me = null;

/* ------------------------------- загрузка ------------------------------- */
async function boot() {
  try { me = (await api('/api/me')).user; }
  catch { location.href = '/'; return; }
  if (me.role === 'admin') { location.href = '/admin'; return; }

  document.getElementById('userName').textContent = me.name;
  document.getElementById('userAva').textContent = (me.name[0] || '?').toUpperCase();
  document.getElementById('logoutBtn').innerHTML = ICONS.logout;
  document.getElementById('logoutBtn').onclick = async () => {
    await api('/api/logout', { method: 'POST' }).catch(() => {});
    location.href = '/';
  };

  const NAV = { tests: 'Мои тесты', results: 'Мои результаты' };
  const NAV_ICONS = { tests: ICONS.doc, results: ICONS.chart };
  document.querySelectorAll('#nav a').forEach(a => {
    a.innerHTML = NAV_ICONS[a.dataset.view] + `<span>${NAV[a.dataset.view]}</span>`;
    a.href = '#' + a.dataset.view;
  });

  document.getElementById('answerBtn').onclick = () => submitAnswer();
  window.addEventListener('hashchange', () => {
    if (taking) { /* во время прохождения навигация заблокирована */
      history.forward();
      return;
    }
    switchView();
  });
  switchView();
}

function showOnly(id) {
  document.querySelectorAll('.view').forEach(s => { s.hidden = s.id !== id; });
  const v = id.replace('view-', '');
  document.querySelectorAll('#nav a').forEach(a => a.classList.toggle('active', a.dataset.view === v));
}

function switchView() {
  let v = (location.hash || '#tests').slice(1);
  if (!['tests', 'results'].includes(v)) v = 'tests';
  showOnly('view-' + v);
  if (v === 'tests') loadTests();
  else loadResults();
}

/* ---------------------------- МОИ ТЕСТЫ --------------------------------- */
const CLOCK_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="width:12px;height:12px;vertical-align:-1px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`;

async function loadTests() {
  const rows = await api('/api/my/tests');
  const grid = document.getElementById('testsGrid');
  if (!rows.length) {
    grid.innerHTML = `<div class="panel empty" style="grid-column:1/-1">${ICONS.doc}<b>Пока нет доступных тестов</b>Когда администратор выдаст вам доступ, тесты появятся здесь.</div>`;
    return;
  }
  grid.innerHTML = rows.map(t => {
    const limited = t.availableUntil !== null && t.availableUntil !== undefined;
    const availBadge = !limited
      ? ''
      : t.expired
        ? `<span class="badge badge--danger">${CLOCK_SVG} время вышло</span>`
        : `<span class="badge badge--ok">${CLOCK_SVG} доступен до ${fmtDate(t.availableUntil)}</span>`;
    return `
    <div class="panel test-card">
      <h3>${esc(t.title)}</h3>
      <div class="desc">${esc(t.description) || 'Описание не задано'}</div>
      <div class="meta-row">
        <span class="badge badge--neutral">${t.questionCount} ${plural(t.questionCount, 'вопрос', 'вопроса', 'вопросов')}</span>
        <span class="badge badge--neutral">${CLOCK_SVG} ${t.timePerQuestion} c на вопрос</span>
        <span class="badge badge--neutral">проходной ${t.passPercent}%</span>
      </div>
      ${availBadge ? `<div class="meta-row">${availBadge}</div>` : ''}
      ${t.attempts ? `<div class="meta-row"><span class="badge ${t.bestPercent >= t.passPercent ? 'badge--ok' : ''}">лучший результат: ${t.bestPercent}%</span><span class="badge badge--neutral">${t.attempts} ${plural(t.attempts, 'попытка', 'попытки', 'попыток')}</span></div>` : ''}
      ${t.expired
        ? '<div style="color:var(--muted);font-size:13.5px">Срок доступности теста истёк — попросите администратора продлить время.</div>'
        : `<button class="btn btn--lg" onclick="startTest('${t.id}')">Начать тест</button>`}
    </div>`;
  }).join('');
}

/* --------------------------- МОИ РЕЗУЛЬТАТЫ ----------------------------- */
async function loadResults() {
  const rows = await api('/api/my/results');
  const box = document.getElementById('resultsTable');
  if (!rows.length) {
    box.innerHTML = `<div class="empty">${ICONS.chart}<b>Вы ещё не проходили тесты</b>Начните первый тест во вкладке «Мои тесты».</div>`;
    return;
  }
  box.innerHTML = `<table class="tbl"><thead><tr>
    <th>Дата</th><th>Тест</th><th>Балл</th><th>Результат</th><th></th>
  </tr></thead><tbody>${rows.map(r => `<tr>
    <td class="num">${fmtDate(r.finishedAt)}</td>
    <td><b>${esc(r.testTitle)}</b></td>
    <td class="num">${fmtScore(r.score)} / ${r.total}</td>
    <td><span class="badge ${r.passed ? 'badge--ok' : 'badge--danger'}">${r.percent}%</span></td>
    <td><button class="btn btn--ghost btn--sm" onclick="showMyResult('${r.id}')">Разбор</button></td>
  </tr>`).join('')}</tbody></table>`;
}

async function showMyResult(id) {
  let d;
  try { d = await api('/api/attempts/' + id); }
  catch (e) { toast(e.message, 'err'); return; }
  const modal = openModal(`
    <div class="modal__head"><h2>Разбор прохождения</h2><button class="icon-btn" data-close>${ICONS.x}</button></div>
    <div class="modal__body">
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px">
        <span class="badge badge--neutral">${esc(d.testTitle)}</span>
        <span class="badge badge--neutral">${fmtDate(d.finishedAt)}</span>
        <span class="badge ${d.passed ? 'badge--ok' : 'badge--danger'}">${d.score} / ${d.total} · ${d.percent}%</span>
      </div>
      <div id="mr_review"></div>
    </div>
    <div class="modal__foot"><button class="btn" data-close>Закрыть</button></div>`, { wide: true });
  renderReview(d.review, modal.querySelector('#mr_review'));
}

/* ------------------------ ПРОХОЖДЕНИЕ ТЕСТА ----------------------------- */
let taking = null; // {attemptId, test, questions, idx, selected, timerId, deadline}

async function startTest(testId) {
  let d;
  try { d = await api('/api/attempts', { method: 'POST', body: { testId } }); }
  catch (e) { toast(e.message, 'err'); return; }

  /* пока шёл тест, общее время истекло — сервер завершил попытку сам */
  if (d.finished) return renderResult(d.result, d.testTitle);

  const resume = !!d.resumed;
  const msg = resume
    ? `Тест «${d.test.title}» не завершён.\n\nПродолжить с вопроса ${d.idx + 1} из ${d.test.questionCount}?`
    : `Начать «${d.test.title}»?\n\nВопросов: ${d.test.questionCount}\nНа каждый вопрос: ${d.test.timePerQuestion} секунд\nТаймер нельзя поставить на паузу.`;
  if (!confirm(msg)) return;

  taking = {
    attemptId: d.attemptId,
    test: d.test,
    testId: testId,
    questions: d.questions,
    idx: d.idx || 0,
    selected: [],
    timerId: null,
    deadline: 0,
    busy: false,
    log: []
  };
  showOnly('view-take');
  document.getElementById('takeTitle').textContent = d.test.title;
  showQuestion(d.qTimeLeft);
}

function showQuestion(remaining) {
  const t = taking;
  const q = t.questions[t.idx];
  document.getElementById('takeCounter').textContent = `Вопрос ${t.idx + 1} из ${t.questions.length}`;
  document.getElementById('takeBar').style.width = (t.idx / t.questions.length * 100) + '%';
  document.getElementById('qText').textContent = q.text;
  t.selected = [];
  const hint = document.getElementById('qHint');
  if (hint) hint.hidden = !q.multi;
  const imgBox = document.getElementById('qImg');
  if (imgBox) {
    imgBox.hidden = !q.image;
    imgBox.innerHTML = q.image ? `<img src="${esc(q.image)}" alt="">` : '';
  }

  document.getElementById('qOpts').innerHTML = q.options.map((o, i) => `
    <button class="opt${o.image ? ' opt--img' : ''}" data-i="${o.i}">
      <span class="bub">${LETTERS[i]}</span>
      <span class="opt__body">${o.image ? `<img class="opt__img" src="${esc(o.image)}" alt="">` : ''}${o.text ? `<span>${esc(o.text)}</span>` : ''}</span>
    </button>`).join('');

  document.querySelectorAll('#qOpts .opt').forEach(btn => {
    btn.onclick = () => {
      const i = +btn.dataset.i;
      if (q.multi) {
        t.selected = t.selected.includes(i) ? t.selected.filter(x => x !== i) : t.selected.concat(i);
      } else {
        t.selected = [i];
        document.querySelectorAll('#qOpts .opt').forEach(b => b.classList.remove('selected'));
      }
      btn.classList.toggle('selected', t.selected.includes(i));
      document.getElementById('answerBtn').disabled = !t.selected.length;
    };
  });
  const ab = document.getElementById('answerBtn');
  ab.disabled = true;
  ab.textContent = t.idx === t.questions.length - 1 ? 'Завершить тест' : 'Ответить';

  startTimer(remaining);
}

const CIRC = 2 * Math.PI * 33; /* длина окружности r=33 */

function startTimer(remaining) {
  clearInterval(taking.timerId);
  const total = taking.test.timePerQuestion;
  /* после дозапуска таймер продолжается с оставшегося времени, не с нуля */
  const left0 = (typeof remaining === 'number' && remaining >= 0) ? Math.min(remaining, total) : total;
  taking.deadline = Date.now() + left0 * 1000;
  const timerEl = document.getElementById('takeTimer');
  const arc = document.getElementById('timerArc');
  const num = document.getElementById('timerNum');
  timerEl.className = 'timer';
  arc.style.strokeDasharray = CIRC;
  arc.style.strokeDashoffset = 0;

  function tick() {
    const left = Math.max(0, Math.round((taking.deadline - Date.now()) / 1000));
    num.textContent = fmtTimeLeft(left);
    const frac = total ? left / total : 0;
    arc.style.strokeDashoffset = CIRC * (1 - frac);
    timerEl.className = 'timer' + (frac <= .12 ? ' timer--danger' : frac <= .3 ? ' timer--warn' : '');
    if (left <= 0) {
      clearInterval(taking.timerId);
      toast('Время на вопрос истекло', 'err');
      submitAnswer(true);
    }
  }
  tick();
  taking.timerId = setInterval(tick, 250);
}

async function submitAnswer(auto = false) {
  if (!taking || taking.busy) return;
  const t = taking;
  const q = t.questions[t.idx];
  const held = t.deadline; /* запоминаем дедлайн на случай сбоя сети */
  t.busy = true;
  clearInterval(t.timerId);
  try {
    await api(`/api/attempts/${t.attemptId}/answer`, {
      method: 'POST',
      body: { questionId: q.id, options: t.selected }
    });
  } catch (e) {
    t.busy = false;
    if (e.status === 404) {
      /* попытка потерялась — молча создаём новую, повторяем ответы, продолжаем */
      return recoverAttempt(q);
    }
    if (e.status) {
      /* сервер ответил отказом (попытка закрыта и т.п.) — получаем финал */
      toast(e.message, 'err');
      return finishTest();
    }
    /* сеть дрогнула: вопрос никуда не денется — остаёмся и отправим повторно */
    toast('Нет связи — как только она появится, ответ отправится автоматически', 'err');
    const left = Math.max(0, Math.round((held - Date.now()) / 1000));
    if (taking) startTimer(left > 0 ? left : 5); /* 5 секунд на повтор, если время вопроса вышло */
    return;
  }

  t.busy = false;
  t.log.push({ questionId: q.id, options: t.selected }); /* журнал для самовосстановления */
  t.idx++;
  if (t.idx >= t.questions.length) finishTest();
  else showQuestion();
}

/* потерянная попытка: новая + повтор всех предыдущих ответов + продолжение */
async function recoverAttempt(currentQ) {
  const t = taking;
  toast('Восстанавливаем тест…');
  try {
    const d = await api('/api/attempts', { method: 'POST', body: { testId: t.testId } });
    if (d.finished) return renderResult(d.result, d.testTitle);
    for (const entry of t.log) {
      await api(`/api/attempts/${d.attemptId}/answer`, { method: 'POST', body: { questionId: entry.questionId, options: entry.options } });
    }
    const curId = currentQ.id;
    const newIndex = Math.max(0, d.questions.findIndex(x => x.id === curId));
    taking = { attemptId: d.attemptId, test: d.test, questions: d.questions, idx: newIndex, selected: [], timerId: null, deadline: 0, busy: false, log: t.log.slice(), testId: t.testId };
    showQuestion(d.qTimeLeft);
    toast('Тест восстановлен — продолжайте', 'ok');
  } catch (e2) {
    toast(e2.message || 'Не удалось восстановить тест', 'err');
    location.hash = '#tests';
    switchView();
  }
}

async function finishTest() {
  if (!taking) return;
  clearInterval(taking.timerId);
  const attemptId = taking.attemptId;
  const testTitle = taking.test.title;
  taking = null;
  let d;
  try { d = await api(`/api/attempts/${attemptId}/finish`, { method: 'POST' }); }
  catch (e) {
    if (!e.status) {
      /* сети нет: попытка сохранена, при следующем «Начать тест» сервер сам покажет результат */
      toast('Нет связи с сервером. Попытка сохранена — зайдите в тест ещё раз.');
      location.hash = '#tests';
      switchView();
      return;
    }
    toast(e.message, 'err');
    location.hash = '#tests';
    switchView();
    return;
  }

  renderResult(d, testTitle);
}

function renderResult(d, testTitle) {
  const ringColor = d.passed ? '#1F9D63' : '#D64545';
  const C = 2 * Math.PI * 70;

  /* результат на весь экран — как экран прохождения */
  taking = null;
  showOnly('view-finish');
  document.getElementById('finishBox').innerHTML = `
    <div class="take__top">
      <div><b>${esc(testTitle)}</b><div class="take__counter" style="margin-top:2px">Результат</div></div>
    </div>
    <div class="take__progress"><i style="width:100%"></i></div>
    <div class="panel qcard__take">
      <div class="finish-wrap">
        <div class="result-hero">
          <div class="score-ring score-ring--lg">
            <svg viewBox="0 0 168 168"><circle class="bgc" cx="84" cy="84" r="70"/><circle class="fgc" cx="84" cy="84" r="70" style="stroke:${ringColor};stroke-dasharray:${C};stroke-dashoffset:${C * (1 - d.percent / 100)}"/></svg>
            <div class="val">${d.percent}<small>%</small></div>
          </div>
          <div class="verdict" style="color:${ringColor}">${d.passed ? 'Тест пройден' : 'Тест не пройден'}</div>
          <div class="detail">Верно ${fmtScore(d.score)} из ${d.total} · проходной балл ${d.passPercent}%</div>
        </div>
        <div class="mistakes" id="resMistakes"></div>
      </div>
      <div class="take__foot" style="justify-content:center">
        <button class="btn btn--lg" id="resBack">К моим тестам</button>
      </div>
    </div>`;
  renderMistakes(d.review, document.getElementById('resMistakes'));
  document.getElementById('resBack').onclick = () => {
    document.getElementById('finishBox').innerHTML = '';
    location.hash = '#tests';
    switchView();
  };
}

boot();

</script>
